<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#0f1733">
  <title>Dashboard | Prof. Dr. Chandra Shekhar</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/admin/admin.js" defer></script>
  <script src="/admin/settings.js" defer></script>
</head>
<body>
  <main id="login-view" class="login-view">
    <form id="login-form" class="login-card">
      <div class="logo" aria-hidden="true">CS</div>
      <h1>Website dashboard</h1>
      <p class="muted">Sign in with your Admin ID and password.</p>
      <div class="fld"><label for="username">Admin ID</label><input id="username" type="text" autocomplete="username" required></div>
      <div class="fld"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="8"></div>
      <button class="btn" type="submit">Sign in</button>
      <p id="login-error" class="err" role="alert" hidden></p>
    </form>
  </main>

  <div id="app" class="adm" hidden>
    <div class="a-mbar">
      <b class="a-mlogo">Chandra <i>Shekhar</i></b>
      <button id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
    </div>
    <div id="scrim" class="a-scrim" hidden></div>
    <div class="a-shell">
      <aside id="side" class="a-side" aria-label="Dashboard">
        <a href="#/dashboard" class="a-brand">Chandra <i>Shekhar</i><small>Website dashboard</small></a>
        <div class="a-grp">Overview</div>
        <a class="a-link" data-nav="dashboard" href="#/dashboard"><span class="a-ico"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Dashboard</a>
        <div class="a-grp">Content</div>
        <a class="a-link" data-nav="blog" href="#/blog"><span class="a-ico"><svg viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M7 9h7M7 13h7M7 16h4"/></svg></span>Blog posts</a>
        <a class="a-link" data-nav="moments" href="#/moments"><span class="a-ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></span>Moments</a>
        <div class="a-grp">Website</div>
        <a class="a-link" data-nav="hero" href="#/hero"><span class="a-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg></span>Hero photo</a>
        <a class="a-link" data-nav="logo" href="#/logo"><span class="a-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 15l2.5-6 1.5 3.5L13.5 9 16 15"/></svg></span>Site logo</a>
        <a class="a-link" data-nav="videos" href="#/videos"><span class="a-ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg></span>YouTube thumbnail</a>
        <a class="a-link" data-nav="settings" href="#/settings"><span class="a-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span>Settings</a>
        <div class="a-grp">Account</div>
        <a class="a-link" data-nav="password" href="#/password"><span class="a-ico"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>Account</a>
        <div class="grow"></div>
        <a class="a-link" href="/" target="_blank" rel="noopener noreferrer"><span class="a-ico"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg></span>View website</a>
        <button id="logout" class="a-link as-btn" type="button"><span class="a-ico"><svg viewBox="0 0 24 24"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></svg></span>Sign out</button>
      </aside>
      <main id="view" class="a-main"></main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
